name: publish-pages

# Mirror file rilis (JIDict.json + JIDict-yomitan.zip) ke GitHub Pages
# agar bisa di-fetch browser dengan CORS (github.com meblokir CORS).
# Workflow ini HANYA membaca aset rilis — tidak menyentuh src/data.
# Pemicu: tiap rilis published + manual (untuk backfill).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Unduh aset rilis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="$(gh release view --repo '${{ github.repository }}' --json tagName --jq .tagName)"; fi
          echo "tag=$TAG"
          gh release download "$TAG" --repo '${{ github.repository }}' --pattern 'JIDict.json' --pattern 'JIDict-yomitan.zip' --dir site
          ls -lh site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
